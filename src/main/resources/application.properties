spring.application.name=marketplace

#  MARKETPLACE SUPERMERCADO - CONFIGURACIÓN

# --- Servidor ---
server.port=8080
server.servlet.context-path=/api/v1

# --- Base de Datos PostgreSQL ---
spring.datasource.url=jdbc:postgresql://localhost:5432/marketplace_db
spring.datasource.username=postgres
spring.datasource.password=password123
spring.datasource.driver-class-name=org.postgresql.Driver

# --- JPA / Hibernate ---
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# --- Schemas por defecto (Hibernate los creará si no existen) ---
spring.jpa.properties.hibernate.default_schema=core

# --- Configuración de conexión ---
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.idle-timeout=300000

# --- Logging ---
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE

# --- DevTools ---
spring.devtools.restart.enabled=true
spring.devtools.livereload.enabled=true

# --- OpenAPI / Swagger ---
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=method